# Put this file in your repo at: .github/workflows/update.yml
name: Update TCYFL data

on:
  schedule:
    # Runs hourly from 2:00 PM Saturday through 2:00 PM Monday (US Central Time).
    # NOTE: GitHub Actions schedules evaluate in UTC.
    # Chicagoland operates in US Central Time:
    #   - Central Daylight Time (CDT, UTC-5): late March to early November
    #   - Central Standard Time (CST, UTC-6): early November to mid-March
    # Hours breakdown:
    #   - Saturday 19:00-23:00 UTC: 2:00 PM CDT / 1:00 PM CST Saturday through Saturday night
    #   - Sunday 00:00-23:00 UTC: All day Sunday UTC (covers all Sunday CT games & evening posts)
    #   - Monday 00:00-20:00 UTC: Sunday night CT through 2:00 PM CST / 3:00 PM CDT Monday
    # (To run every 30 minutes instead of hourly, change the leading '0' to '*/30')
    - cron: "0 19-23 * * 6"
    - cron: "0 * * * 0"
    - cron: "0 0-20 * * 1"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: tcyfl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          python tcyfl_scraper.py --out docs
          cp docs/tcyfl.html docs/index.html

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TCYFL data"
            git push
          fi
